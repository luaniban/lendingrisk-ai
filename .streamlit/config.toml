# Tema visual LendingRisk AI. Estilos complementares em assets/styles.css.
[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#3065e9"
backgroundColor = "#f5f7fc"
secondaryBackgroundColor = "#f7f9fd"
textColor = "#192943"
linkColor = "#3065e9"
borderColor = "#e4ebf6"
dataframeBorderColor = "#e4ebf6"
redColor = "#b32636"
greenColor = "#087b60"
blueColor = "#3065e9"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseRadius = "0.75rem"
buttonRadius = "0.5rem"
headingFontWeights = 700
headingFontSizes = ["2rem", "1.4rem", "1.15rem", "1rem", "0.9rem", "0.8rem"]
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f7f9fd"
